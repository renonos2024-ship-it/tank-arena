<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c28"><title>月灯りのメダル塔｜宵まちメダル横丁</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><a class="back" href="../arcade-3d/index.html" aria-label="横丁へ戻る">← 横丁</a><div class="title"><small>宵まちメダル横丁</small><h1>月灯りのメダル塔</h1></div><div class="wallet"><small>手持ちメダル</small><b id="wallet">—</b></div></header>
<section class="cabinet" aria-label="3Dコインプッシャー"><canvas id="scene" aria-label="ドラッグで投入口を左右へ移動"></canvas><div class="topline"><span id="stageName">月灯りの間</span><span>獲得 <b id="earned">0</b> 枚</span></div><div class="badge">月 灯 り<br><small>MEDAL TOWER</small></div><div class="hint" id="hint" aria-live="polite">準備しています…</div><div class="intro" id="intro"><div><span class="moon">◒</span><h2>一枚から、塔が動く。</h2><p>指で投入口を動かす。<br>もう一方の指で投入。<br>押し板と、塔の足元を見てみよう。</p><button id="start" disabled>準備中…</button><small id="bootStatus">物理エンジンを読み込み中</small></div></div></section>
<section class="controls"><div class="modes" aria-label="投入道具"><button data-cost="1" class="selected" aria-pressed="true"><b>1枚</b><small>メダル</small></button><button data-cost="3" aria-pressed="false"><b>3枚</b><small>連続投入</small></button><button data-cost="5" aria-pressed="false"><b>5枚</b><small>重量球</small></button></div><button class="launch" id="launch">投入 <span>↓</span></button></section>
<div class="utility"><button id="pause">一時停止</button><button id="refill">＋30枚・無料</button><span id="saveState">自動保存</span></div>
<section class="details"><div><small>投入</small><b id="spent">0</b></div><div><small>盤面の枚数</small><b id="inventory">0</b></div><div><small>側面への落下</small><b id="side">0</b></div></section>
<details><summary>ステージ・音・画質</summary><label>ステージ<select id="stage"><option value="0">夜の横丁</option><option value="1">黄金の押し板</option><option value="2">静かな水路</option><option value="3">倍速フェス</option><option value="4">宵まち大祭</option></select></label><label>BGM<input id="bgm" type="range" min="0" max="1" step="0.05"></label><label>効果音<input id="se" type="range" min="0" max="1" step="0.05"></label><label>画質<select id="quality"><option value="auto">標準</option><option value="low">軽量</option></select></label><button id="export">セーブを書き出す</button><p>PC：← →で投入位置、Spaceで投入、Pで一時停止。重量球は押す力が強く、手前に落ちると1枚。投入後は押し板が往復し、落ち着くと停止します。</p></details>
<footer>研究開発版 0.4 · 実機の操作・描画検証待ち<br>課金・換金なし。保存はこのブラウザ内。<span id="diagnostic"></span></footer>
</main><script src="../shared/store.js"></script><script type="module" src="main.js"></script></body></html>
