name: Yoimachi validation
on:
  push:
    branches: [yoimachi-renewal-20261014]
  pull_request:
    paths: ['medal-yokocho/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/yoimachi.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
